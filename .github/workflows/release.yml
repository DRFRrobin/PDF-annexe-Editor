name: Release

on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release existante à compléter (ex. V1.1.5)'
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            ext: .exe
            suffix: windows-x86_64
          - os: ubuntu-latest
            ext: ''
            suffix: linux-x86_64
          - os: macos-latest
            ext: ''
            suffix: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: cargo test --release
        working-directory: rust
      - name: Build
        run: cargo build --release
        working-directory: rust
      - name: Renommer
        shell: bash
        run: cp "rust/target/release/annexio${{ matrix.ext }}" "annexio-${{ matrix.suffix }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: annexio-${{ matrix.suffix }}
          path: annexio-*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: annexio-*
          generate_release_notes: true

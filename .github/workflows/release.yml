name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            bin: pdf-annexe.exe
            asset: pdf-annexe-windows-x86_64.exe
          - os: ubuntu-latest
            bin: pdf-annexe
            asset: pdf-annexe-linux-x86_64
          - os: macos-latest
            bin: pdf-annexe
            asset: pdf-annexe-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: cargo test --release
        working-directory: rust
      - name: Build
        run: cargo build --release
        working-directory: rust
      - name: Renommer
        shell: bash
        run: cp "rust/target/release/${{ matrix.bin }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: pdf-annexe-*
          generate_release_notes: true

[package]
name = "pdf-annexe"
version = "1.1.9"
edition = "2021"
description = "Ajoute un rectangle rouge « Annexe X Folio n/N » sur les pages d'un PDF (100 % local)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pdf-annexe"
path = "src/gui.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:hayro", "dep:ureq", "dep:serde_json"]
wasm = ["dep:wasm-bindgen", "dep:serde", "dep:serde_json"]

[dependencies]
lopdf = { version = "0.47", default-features = false }
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
eframe = { version = "0.37", optional = true }
rfd = { version = "0.18", optional = true }
ureq = { version = "3", optional = true, features = ["platform-verifier"] }
hayro = { version = "0.9", optional = true, features = ["embed-fonts"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
strip = true
lto = "thin"
